<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Email verified</title>
    <style>
      body { font-family: system-ui, -apple-system, Arial; padding: 24px; max-width: 640px; margin: 0 auto; text-align: center; }
      .card { border: 1px solid #e5e7eb; border-radius: 14px; padding: 24px; background: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
      h1 { margin: 0 0 16px; font-size: 24px; color: #0A47B2; }
      p { margin: 0 0 20px; line-height: 1.5; color: #374151; }
      .btn { display: inline-block; background: #0A47B2; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Email Verified!</h1>
      <p>Your email has been successfully verified. We are redirecting you back to the app...</p>
      <a id="open-app-btn" href="#" class="btn">Open App Manually</a>
    </div>
    <script>
      // The deep link scheme defined in AndroidManifest.xml and Info.plist
      const DEEP_LINK = "io.supabase.flutterquickstart://login-callback/";

      // Supabase appends session info (access_token, etc.) in the URL hash
      const hash = window.location.hash;
      const redirectUrl = DEEP_LINK + hash;

      // Update manual button link
      document.getElementById('open-app-btn').href = redirectUrl;

      // Attempt immediate automatic redirect
      window.location.href = redirectUrl;

      // Fallback redirect after a short delay
      setTimeout(() => { window.location.href = redirectUrl; }, 1000);
    </script>
  </body>
</html>
