<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Email verified</title>
    <style>
      body { font-family: system-ui, -apple-system, Arial; padding: 24px; max-width: 640px; margin: 0 auto; }
      .card { border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0; line-height: 1.4; color: #374151; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Email verified</h1>
      <p>You can close this tab and return to the app, then log in with your email + password.</p>
      <p style="margin-top:10px">If you see an error, copy the full URL and send it to the developer.</p>
      <p style="margin-top:10px"><code id="u"></code></p>
    </div>
    <script>document.getElementById('u').textContent = location.href;</script>
  </body>
</html>
